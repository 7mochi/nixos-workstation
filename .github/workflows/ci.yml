name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Nix checks
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.2
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Flake check
        run: nix flake check --no-build

      - name: Generated flake check
        run: nix build .#checks.x86_64-linux.check-flake-file

      - name: Format and lint check
        run: nix build .#checks.x86_64-linux.treefmt

      - name: Secret scan
        run: nix build .#checks.x86_64-linux.check-secrets

      - name: Niri design check
        run: nix build .#checks.x86_64-linux.niri-no-app-workflows

      - name: fwupd/polkit ordering check
        run: nix build .#checks.x86_64-linux.fwupd-refresh-polkit-ordering

      - name: Build custom packages
        run: |
          nix build --no-link \
            .#checks.x86_64-linux.citron-nextendo \
            .#checks.x86_64-linux.ctr-nitro-fueled-appimage \
            .#checks.x86_64-linux.osu-lazer-torii-appimage \
            .#checks.x86_64-linux.power-bomberman \
            .#checks.x86_64-linux.retrogecko

      - name: Build the workstation toplevel
        run: nix build --no-link .#nixosConfigurations.workstation.config.system.build.toplevel
