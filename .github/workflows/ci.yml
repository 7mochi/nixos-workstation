name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Nix checks
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.2
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: Flake check
        run: nix flake check --no-build

      - name: Format check
        run: nix build .#checks.x86_64-linux.format

      - name: Deadnix check
        run: nix build .#checks.x86_64-linux.deadnix

      - name: Statix check
        run: nix build .#checks.x86_64-linux.statix

      - name: Secret scan
        run: nix build .#checks.x86_64-linux.check-secrets

      - name: Niri design check
        run: nix build .#checks.x86_64-linux.niri-no-app-workflows

      - name: fwupd/polkit ordering check
        run: nix build .#checks.x86_64-linux.fwupd-refresh-polkit-ordering

      - name: Evaluate the workstation toplevel
        run: nix build --dry-run --no-link .#nixosConfigurations.workstation.config.system.build.toplevel
